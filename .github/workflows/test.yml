name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: JSON validi
        run: |
          for f in custom_components/avvisi_targhe/manifest.json custom_components/avvisi_targhe/strings.json custom_components/avvisi_targhe/translations/*.json hacs.json; do python -m json.tool "$f" >/dev/null; done
      - name: Installa Home Assistant di prova
        run: pip install -r requirements_test.txt
      - name: Prove
        run: python -m pytest -v
